services:
  service:
    build:
      context: .
    image: ${IMAGE:-pr6-service:local}
    container_name: pr6-service
    env_file:
      - path: .env
        required: false
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0}
      APP_ENV: ${APP_ENV:-dev}
      PORT: ${PORT:-8000}
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
