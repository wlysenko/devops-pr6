services:
  service:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    image: pr6-service:${APP_VERSION:-1.0.0}
    container_name: pr6-service
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0}
      APP_ENV: ${APP_ENV:-dev}
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
